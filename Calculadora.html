<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <!-- Menú Desplegable Bootstrap -->
    <div class="dropdown nav-item">
        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Navegación
        </a>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="Calculadora.html">Calculadora Completa</a></li>
            <li><a class="dropdown-item" href="sumas.html">Sumas</a></li>
            <li><a class="dropdown-item" href="resta.html">Restas</a></li>
            <li><a class="dropdown-item" href="multiplicacion.html">Multiplicaciones</a></li>
            <li><a class="dropdown-item" href="division.html">Divisiones</a></li>
        </ul>
    </div>

    <h1>Calculadora</h1>

    <!-- Contenedor Principal de la Calculadora -->
    <div class="calculadora">
        <input type="text" id="Pantalla" readonly>
        
        <div class="botones">
            <button onclick="agregar(7)">7</button>
            <button onclick="agregar(8)">8</button>
            <button onclick="agregar(9)">9</button>
            <button class="btn-operador" onclick="agregar('/')">/</button>

            <button onclick="agregar(4)">4</button>
            <button onclick="agregar(5)">5</button>
            <button onclick="agregar(6)">6</button>
            <button class="btn-operador" onclick="agregar('*')">*</button>

            <button onclick="agregar(1)">1</button>
            <button onclick="agregar(2)">2</button>
            <button onclick="agregar(3)">3</button>
            <button class="btn-operador" onclick="agregar('-')">-</button>

            <button onclick="agregar(0)">0</button>
            <button class="btn-operador" onclick="agregar('+')">+</button>
            <button class="btn-igual" onclick="calcular()">=</button>

            <button class="btn-eliminar" onclick="eliminar()">Eliminar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="calculadora.js"></script>
</body>

</html>
